<script>
(function(){
var M=[
 ["Turn-taking","When the agent decides you have stopped speaking"],
 ["Calls that got stuck","Ways a call could freeze or end badly"],
 ["Browser and phone","Getting connected, staying connected"],
 ["Numbers and records","Costs, timings, transcripts, recordings"],
 ["Speed and memory","The agent got lighter"],
 ["What we changed","The five places we wrote code"],
 ["Watch on deploy","Three things that move. None is a bug"],
 ["On the shelf","Now possible, not taken"]
];

// slide = [kind, headline, body]   kinds: setup trap before now us num demo
var L=[];
function les(m,t,s){L.push({m:m,t:t,s:s});}

/* ---------- M1 turn-taking ---------- */
les(0,"The pause that ended turns early",[
 ["over","If a caller paused mid-answer, the agent answered anyway","The caller paused for half a second in the middle of an answer, then carried on. The agent took the first half as the whole answer and started replying while the caller was still talking. This lesson traces that failure through the code step by step, then shows the fix.","split"],
 ["setup","First, what a turn is","A turn is one person\'s go at speaking. The caller\'s turn opens when the caller starts answering and closes when the agent decides the caller has finished. This lesson is about that closing decision.","turn"],
 ["setup","Closing a turn is a judgement call","Close the turn too early and the agent cuts the caller off. Close it too late and the agent feels slow. Our config sets <code>user_speech_timeout=0.4</code>: once the caller\'s latest words have arrived, the agent waits 0.4 seconds for more before closing the turn.","hard"],
 ["setup","One question, two inputs","One piece of code closes the turn. Its only job is to decide whether the caller has finished. Pipecat calls this piece a <b>stop strategy</b>. Ours is <code>SpeechTimeoutUserTurnStopStrategy(user_speech_timeout=0.4)</code>, chosen in <code>dictation_mode.py</code>. It has two inputs to decide from. Pipecat delivers both as <b>frames</b>: small messages passed along the call pipeline.","pipeline"],
 ["setup","Input 1: is the caller making sound right now","<code>SileroVADAnalyzer</code> does voice activity detection, VAD for short. It listens to the caller\'s incoming speech and answers one question: is the caller making sound at this instant. It cannot read words. It reports by sending <code>VADUserStartedSpeakingFrame</code> and <code>VADUserStoppedSpeakingFrame</code>. Our config sets <code>stop_secs=0.2</code>, so the caller must be quiet for 0.2 seconds before it sends a stop frame. In 1.2.1 the stop strategy wrote these frames down in two fields.","vadtrack"],
 ["setup","A real pause is handled correctly","The caller goes quiet. After 0.2 seconds, <code>SileroVADAnalyzer</code> sends <code>VADUserStoppedSpeakingFrame</code>. The stop strategy sets <code>_vad_user_speaking</code> to <code>False</code> and records the time in <code>_vad_stopped_time</code>. When the caller resumes, <code>SileroVADAnalyzer</code> sends <code>VADUserStartedSpeakingFrame</code>, and the stop strategy sets <code>_vad_user_speaking</code> back to <code>True</code>, clears <code>_vad_stopped_time</code>, and cancels any pending timer. A real pause was never the problem.","pause"],
 ["setup","Input 2: the words, which arrive late","<code>SarvamSTTService</code> does not send words while the caller is talking. When <code>SileroVADAnalyzer</code> sends a stop frame, Pipecat tells Sarvam to flush, and Sarvam returns one <code>TranscriptionFrame</code> holding everything said so far. That frame arrives some time after the pause began. Pipecat\'s own worst-case figure for Sarvam is 1.17 seconds. By then the caller may already be talking again.","late"],
 ["trap","Our turn opens on that late transcript","<code>MinWordsUserTurnStartStrategy(min_words=1)</code> opens the caller\'s turn on the first <code>TranscriptionFrame</code>. If the caller paused briefly and carried on, that frame lands after the caller has resumed. So the turn opens while the caller is mid-sentence.","turnstart"],
 ["before","Opening the turn reset the stop strategy","<code>UserTurnController</code> hands each frame to the start strategy first and the stop strategy second. When the start strategy opens a turn, the controller calls <code>reset()</code> on the stop strategy, before the same transcript reaches it. In 1.2.1, <code>reset()</code> set <code>_vad_user_speaking</code> to <code>False</code> and <code>_vad_stopped_time</code> to <code>None</code>. The caller was still speaking, and <code>SileroVADAnalyzer</code> sent nothing new, because it only sends a start frame after a stop frame.","wipe"],
 ["before","Those two values together mean something specific","<code>_vad_user_speaking</code> <code>False</code> with <code>_vad_stopped_time</code> <code>None</code> means no VAD frame has arrived this turn at all. A real pause cannot produce that, because a real pause records a stop time. While someone is talking, only the reset produces it.","bothfalse"],
 ["before","The transcript then took the wrong branch","Sarvam's transcript now reaches the code that closes turns. That code asks one question: has VAD told me nothing at all this turn? If the answer is yes, it assumes VAD is not in use and starts its own 0.4 second timer to close the turn. The reset had just erased both VAD notes, so the answer came out yes, even though VAD had been reporting all along and the caller was still talking. The timer started.","branch"],
 ["before","That branch starts the 0.4 second timer","The branch calls <code>_restart_user_speech_timer()</code>, which closes the turn 0.4 seconds after this transcript unless a new VAD frame cancels it first. The caller is mid-sentence, so <code>SileroVADAnalyzer</code> sends nothing. The timer expires and the turn closes while the caller is still talking.","timer"],
 ["before","What lands in the transcript","The NEXT REPLY LLM answers the first half. The words after the pause come back later as a new caller turn of their own. Two caller rows around one agent row, for a single spoken answer, is the fingerprint of this bug.","hindi"],
 ["demo","Watch it happen","Six seconds of a call, with illustrative timings. Press Play. Press Show to switch between 1.2.1 and 1.8.1. Play it again."],
 ["now","The fix: opening a turn leaves _vad_user_speaking alone","Pipecat 1.6.0 (PR #4983) stopped the turn opening from clearing <code>_vad_user_speaking</code>. In 1.8.1 the controller calls <code>handle_user_turn_started()</code>, which runs <code>_reset(clear_vad_user_speaking=False)</code>. Closing a turn still clears it. Pipecat\'s own comment on the method gives the reason: the flag reflects live VAD state, not per-turn bookkeeping.","fixtrack"],
 ["now","So the wrong branch is no longer taken","The notes VAD wrote are left alone when the turn opens, so the code still knows the caller is talking. The answer to its question is no. It keeps the turn open and waits for VAD to report that the caller has really stopped.","branch2"],
 ["us","You can now read Pipecat\'s own description","<i>&ldquo;&hellip;ended the user turn mid-utterance when a new turn&rsquo;s reset() cleared VAD speaking state while the user was still talking.&rdquo;</i> Every term in that sentence is one you have now met. It goes on to mention a finalized transcript. Ours are never finalized, but the branch never checked, so the bug reached us all the same.","quote"],
 ["us","How to see it for yourself","No automated test covers this, because the fix is in Pipecat, not in our code. On the branch, make a call and answer a question in two halves, pausing about half a second between them. The pause has to be longer than 0.2 seconds, so VAD reports a stop, and short enough that you resume before Sarvam\'s transcript comes back. Then open <code>transcript.json</code> and count the caller rows for that answer.","bars"],
 ["us","Pipecat 1.6.0, PR #4983. No code from us","Nothing in our diff implements this fix. We get it by upgrading. That is the reason this PR exists.","pr"]
]);

var KEY="pc-course-v4", seen={}, vis={}, autoed={};
try{ var st=JSON.parse(localStorage.getItem(KEY)||"{}")||{};
     seen=st.done||{}; vis=st.slides||{}; autoed=st.autoed||{}; }catch(e){ seen={}; vis={}; autoed={}; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify({done:seen,slides:vis,autoed:autoed})); }catch(e){} }
function slidesSeen(li){ var v=vis[li]||{},n=0; for(var k in v) if(v[k]) n++; return n; }

var at=0, open={};
L.forEach(function(l){ open[l.m]=false; }); open[0]=true;

var sideEl=document.getElementById("side"), slideEl=document.getElementById("slide"),
    whereEl=document.getElementById("where"), pipsEl=document.getElementById("pips"),
    tbar=document.getElementById("tbar"), tnum=document.getElementById("tnum"),
    prevB=document.getElementById("prev"), nextB=document.getElementById("next"),
    markB=document.getElementById("mark");

function lessonDone(li){ return !!seen[li]; }
function modCount(mi){ var t=0,d=0; L.forEach(function(l,i){ if(l.m===mi){t++; if(lessonDone(i))d++;} }); return [d,t]; }

function buildSide(){
  sideEl.innerHTML="";
  M.forEach(function(m,mi){
    var c=modCount(mi);
    var h=document.createElement("button");
    h.className="mhead"; h.setAttribute("aria-expanded",open[mi]?"true":"false");
    h.setAttribute("data-full",c[0]===c[1]?"1":"0");
    h.innerHTML='<span><small>Module '+(mi+1)+'</small>'+m[0]+'</span>'+
                '<span class="mcount">'+c[0]+'/'+c[1]+'</span><span class="caret"></span>';
    h.addEventListener("click",function(){ open[mi]=!open[mi]; buildSide(); });
    sideEl.appendChild(h);

    var ul=document.createElement("div"); ul.className="llist"; ul.hidden=!open[mi];
    L.forEach(function(l,li){
      if(l.m!==mi) return;
      var b=document.createElement("button");
      b.className="li";
      b.setAttribute("data-done",lessonDone(li)?"1":"0");
      b.setAttribute("data-live",FLAT[at].li===li?"1":"0");
      var notUs = l.s.length===1 && l.s[0][0]==="skip";
      var avail = l.s.length===1 && l.s[0][0]==="avail";
      b.setAttribute("data-skip",notUs?"1":"0");
      b.setAttribute("data-avail",avail?"1":"0");
      b.innerHTML='<span class="dot"></span><span>'+l.t+'</span>'+
                  (notUs ? '<span class="ltag">not relevant</span>'
                   : avail ? '<span class="ltag av">available</span>'
                   : '<span class="lcount">'+slidesSeen(li)+'/'+l.s.length+'</span>');
      b.addEventListener("click",function(){ go(startOf(li)); });
      ul.appendChild(b);
    });
    sideEl.appendChild(ul);
  });
  var d=0; L.forEach(function(_,i){ if(lessonDone(i)) d++; });
  tbar.style.width=((d/L.length)*100)+"%";
  tnum.textContent=d+" / "+L.length+" lessons";
}

function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
// mark: substrings to highlight inside the code excerpt
function hl(code,marks){var h=esc(code);(marks||[]).forEach(function(m){var e=esc(m);h=h.split(e).join("<mark>"+e+"</mark>");});return h;}
// before/after panel of real source lines
function codepair(o){
  return '<div class="cp">'+(o.cap?'<div class="cp-cap">'+o.cap+'</div>':'')+
   '<div class="cp-box b"><div class="cp-h"><b>'+(o.bl||"Pipecat 1.2.1")+'</b><span>'+esc(o.file||"")+'</span></div><pre>'+hl(o.before,o.bm)+'</pre></div>'+
   '<div class="cp-box a"><div class="cp-h"><b>'+(o.al||"Pipecat 1.8.1")+'</b><span>'+esc(o.file2||o.file||"")+'</span></div><pre>'+hl(o.after,o.am)+'</pre></div>'+
   (o.note?'<div class="cp-note">'+o.note+'</div>':'')+'</div>';
}
// one panel of real source
function codeone(o){
  return '<div class="cp">'+(o.cap?'<div class="cp-cap">'+o.cap+'</div>':'')+
   '<div class="cp-box '+(o.tone||"a")+'"><div class="cp-h"><b>'+(o.label||"Pipecat 1.8.1")+'</b><span>'+esc(o.file||"")+'</span></div><pre>'+hl(o.code,o.marks)+'</pre></div>'+
   (o.note?'<div class="cp-note">'+o.note+'</div>':'')+'</div>';
}
// our production setup, with the component a change touches
// rows: [label, detail, state]  state: "hit" (changed and in production), "miss" (in production, untouched), "off" (not in production)
function stack(o){
  var r=(o.rows||[]).map(function(x){
    var tag=x[3]||{hit:"changed, in production",miss:"in production",off:"not in production",moot:"changed, not in production"}[x[2]]||"";
    return '<div class="stk-row '+x[2]+'"><div>'+x[0]+(x[1]?'<small>'+x[1]+'</small>':'')+'</div><span class="tag">'+tag+'</span></div>';
  }).join("");
  return '<div class="cp">'+(o.cap?'<div class="cp-cap">'+o.cap+'</div>':'')+'<div class="stk">'+r+'</div>'+(o.note?'<div class="cp-note">'+o.note+'</div>':'')+'</div>';
}

  return '<div class="cp s3wrap">'+box("b","Before, 1.2.1",o.before)+box("a","Now, 1.8.1",o.after)+box("u","What it means for us",o.us)+'</div>';
}

function render(){
  var f=FLAT[at], l=L[f.li], s=l.s[f.si], m=M[l.m];
  var lessonNo=L.filter(function(x,i){ return x.m===l.m && i<=f.li; }).length;
  var modTotal=modCount(l.m)[1];

  whereEl.innerHTML='<b>Module '+(l.m+1)+'</b> &middot; '+m[0]+' &nbsp;|&nbsp; Lesson '+lessonNo+' of '+modTotal+
    ' &nbsp;|&nbsp; '+l.t;

  pipsEl.innerHTML="";
  l.s.forEach(function(_,i){
    var p=document.createElement("button"); p.className="pip";
    p.setAttribute("data-on",i===f.si?"1":"0");
    p.setAttribute("data-seen",i<f.si?"1":"0");
    p.setAttribute("aria-label","Slide "+(i+1));
    p.addEventListener("click",function(){ go(startOf(f.li)+i); });
    pipsEl.appendChild(p);
  });

  var kind=s[0];
  var label={over:"What this is about",setup:"Setup",trap:"The trap",before:"Before",now:"Now",us:"For us",num:"By the numbers",demo:"Try it",skip:"Not relevant to us",avail:"Improvement available. Not used yet",take:"What adopting it would take",what:"What it is"}[kind]||"";
  slideEl.setAttribute("data-k",kind);

  var head;
  if(kind==="num"){
    var parts=s[1].split("→");
    head='<div class="kind">'+label+'</div>'+(parts.length===2
      ? '<div class="big"><s>'+parts[0].trim()+'</s>'+parts[1].trim()+'</div>'
      : '<div class="big">'+s[1]+'</div>')+(s[2]?'<p>'+s[2]+'</p>':'');
  } else {
    head='<div class="kind">'+label+'</div><h2>'+s[1]+'</h2>'+(s[2]?'<p>'+s[2]+'</p>':'')+
      (s[4]?'<div class="why"><b>'+(kind==="avail"?"What adopting it would take":"Why not relevant to us")+'</b>'+s[4]+'</div>':'');
  }

  var art = kind==="demo" ? PLAYER : (s[3] && VIS[s[3]] ? VIS[s[3]]() : "");
  if(art){
    slideEl.className="slide hasvis";
    slideEl.innerHTML='<div class="txt">'+head+'</div><div class="vis">'+art+'</div>';
  } else {
    slideEl.className="slide";
    slideEl.innerHTML=head;
  }
  if(kind==="demo") wirePlayer();

  (vis[f.li]=vis[f.li]||{})[f.si]=true;
  if(f.si===l.s.length-1 && !autoed[f.li]){ autoed[f.li]=true; seen[f.li]=true; }
  save();

  markB.textContent = seen[f.li] ? "\u2713 Lesson done" : "Mark lesson done";
  markB.setAttribute("data-on", seen[f.li]?"1":"0");

  prevB.disabled=at===0;
  nextB.disabled=at===FLAT.length-1;
  nextB.textContent = at===FLAT.length-1 ? "Finished"
    : (f.si===l.s.length-1 ? "Next lesson →" : "Next →");

  buildSide();
  window.scrollTo(0,0);
}
function go(i){ at=Math.max(0,Math.min(FLAT.length-1,i)); render(); }

markB.addEventListener("click",function(){
  var li=FLAT[at].li; seen[li]=!seen[li]; autoed[li]=true; save(); render();
});
prevB.addEventListener("click",function(){ go(at-1); });
nextB.addEventListener("click",function(){ go(at+1); });
document.getElementById("rst").addEventListener("click",function(){ seen={}; vis={}; autoed={}; save(); go(0); });
document.addEventListener("keydown",function(e){
  if(e.target&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(e.key==="ArrowRight") go(at+1);
  if(e.key==="ArrowLeft") go(at-1);
});

function wirePlayer(){
  var SPAN=6,pct=function(s){return s/SPAN*100;},mode="before",timer=null;
  var b2=document.getElementById("b2"),ba=document.getElementById("ba"),cu=document.getElementById("cu"),
      pl=document.getElementById("pl"),vd=document.getElementById("vd"),ll=document.getElementById("ll"),
      play=document.getElementById("play"),flip=document.getElementById("flip"),fl=document.getElementById("fl");
  var CB=3.7,RB=3.8,CA=5.0,RA=5.1;
  function paint(){
    var b=mode==="before";
    ll.textContent=b?"Before · 1.2.1":"Now · 1.8.1";
    cu.style.left=pct(b?CB:CA)+"%";
    b2.className="blob "+(b?"x":"c");
    ba.style.left=pct(b?RB:RA)+"%"; ba.style.width=(100-pct(b?RB:RA)-2)+"%";
    vd.textContent=" "; vd.setAttribute("data-t",b?"bad":"good");
    cu.setAttribute("data-on","0"); pl.style.left="0%"; fl.textContent=b?"Before":"Now";
  }
  play.addEventListener("click",function(){
    if(timer) cancelAnimationFrame(timer);
    var b=mode==="before",cutAt=b?CB:CA,t0=performance.now(),DUR=4200;
    cu.setAttribute("data-on","0"); vd.textContent=" "; play.disabled=true;
    (function fr(now){
      var k=Math.min(1,(now-t0)/DUR); pl.style.left=(k*100)+"%";
      if(k*SPAN>=cutAt){ cu.setAttribute("data-on","1"); vd.textContent=b?"half the answer lost":"whole answer kept"; }
      if(k<1){ timer=requestAnimationFrame(fr); } else { timer=null; play.disabled=false; }
    })(t0);
  });
  flip.addEventListener("click",function(){ mode=mode==="before"?"after":"before"; paint(); });
  paint();
}

render();
})();
