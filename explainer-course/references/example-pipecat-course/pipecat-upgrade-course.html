<script>
(function(){
var M=[
 ["Turn-taking","When the agent decides you have stopped speaking"],
 ["Calls that got stuck","Ways a call could freeze or end badly"],
 ["Browser and phone","Getting connected, staying connected"],
 ["Numbers and records","Costs, timings, transcripts, recordings"],
 ["Speed and memory","The agent got lighter"],
 ["What we changed","The five places we wrote code"],
 ["Watch on deploy","Three things that move. None is a bug"],
 ["On the shelf","Now possible, not taken"]
];

// slide = [kind, headline, body]   kinds: setup trap before now us num demo
var L=[];
function les(m,t,s){L.push({m:m,t:t,s:s});}

/* ---------- M1 turn-taking ---------- */
les(0,"The pause that ended turns early",[
 ["over","If a caller paused mid-answer, the agent answered anyway","The caller paused for half a second in the middle of an answer, then carried on. The agent took the first half as the whole answer and started replying while the caller was still talking. This lesson traces that failure through the code step by step, then shows the fix.","split"],
 ["setup","First, what a turn is","A turn is one person\'s go at speaking. The caller\'s turn opens when the caller starts answering and closes when the agent decides the caller has finished. This lesson is about that closing decision.","turn"],
 ["setup","Closing a turn is a judgement call","Close the turn too early and the agent cuts the caller off. Close it too late and the agent feels slow. Our config sets <code>user_speech_timeout=0.4</code>: once the caller\'s latest words have arrived, the agent waits 0.4 seconds for more before closing the turn.","hard"],
 ["setup","One question, two inputs","One piece of code closes the turn. Its only job is to decide whether the caller has finished. Pipecat calls this piece a <b>stop strategy</b>. Ours is <code>SpeechTimeoutUserTurnStopStrategy(user_speech_timeout=0.4)</code>, chosen in <code>dictation_mode.py</code>. It has two inputs to decide from. Pipecat delivers both as <b>frames</b>: small messages passed along the call pipeline.","pipeline"],
 ["setup","Input 1: is the caller making sound right now","<code>SileroVADAnalyzer</code> does voice activity detection, VAD for short. It listens to the caller\'s incoming speech and answers one question: is the caller making sound at this instant. It cannot read words. It reports by sending <code>VADUserStartedSpeakingFrame</code> and <code>VADUserStoppedSpeakingFrame</code>. Our config sets <code>stop_secs=0.2</code>, so the caller must be quiet for 0.2 seconds before it sends a stop frame. In 1.2.1 the stop strategy wrote these frames down in two fields.","vadtrack"],
 ["setup","A real pause is handled correctly","The caller goes quiet. After 0.2 seconds, <code>SileroVADAnalyzer</code> sends <code>VADUserStoppedSpeakingFrame</code>. The stop strategy sets <code>_vad_user_speaking</code> to <code>False</code> and records the time in <code>_vad_stopped_time</code>. When the caller resumes, <code>SileroVADAnalyzer</code> sends <code>VADUserStartedSpeakingFrame</code>, and the stop strategy sets <code>_vad_user_speaking</code> back to <code>True</code>, clears <code>_vad_stopped_time</code>, and cancels any pending timer. A real pause was never the problem.","pause"],
 ["setup","Input 2: the words, which arrive late","<code>SarvamSTTService</code> does not send words while the caller is talking. When <code>SileroVADAnalyzer</code> sends a stop frame, Pipecat tells Sarvam to flush, and Sarvam returns one <code>TranscriptionFrame</code> holding everything said so far. That frame arrives some time after the pause began. Pipecat\'s own worst-case figure for Sarvam is 1.17 seconds. By then the caller may already be talking again.","late"],
 ["trap","Our turn opens on that late transcript","<code>MinWordsUserTurnStartStrategy(min_words=1)</code> opens the caller\'s turn on the first <code>TranscriptionFrame</code>. If the caller paused briefly and carried on, that frame lands after the caller has resumed. So the turn opens while the caller is mid-sentence.","turnstart"],
 ["before","Opening the turn reset the stop strategy","<code>UserTurnController</code> hands each frame to the start strategy first and the stop strategy second. When the start strategy opens a turn, the controller calls <code>reset()</code> on the stop strategy, before the same transcript reaches it. In 1.2.1, <code>reset()</code> set <code>_vad_user_speaking</code> to <code>False</code> and <code>_vad_stopped_time</code> to <code>None</code>. The caller was still speaking, and <code>SileroVADAnalyzer</code> sent nothing new, because it only sends a start frame after a stop frame.","wipe"],
 ["before","Those two values together mean something specific","<code>_vad_user_speaking</code> <code>False</code> with <code>_vad_stopped_time</code> <code>None</code> means no VAD frame has arrived this turn at all. A real pause cannot produce that, because a real pause records a stop time. While someone is talking, only the reset produces it.","bothfalse"],
 ["before","The transcript then took the wrong branch","Sarvam's transcript now reaches the code that closes turns. That code asks one question: has VAD told me nothing at all this turn? If the answer is yes, it assumes VAD is not in use and starts its own 0.4 second timer to close the turn. The reset had just erased both VAD notes, so the answer came out yes, even though VAD had been reporting all along and the caller was still talking. The timer started.","branch"],
 ["before","That branch starts the 0.4 second timer","The branch calls <code>_restart_user_speech_timer()</code>, which closes the turn 0.4 seconds after this transcript unless a new VAD frame cancels it first. The caller is mid-sentence, so <code>SileroVADAnalyzer</code> sends nothing. The timer expires and the turn closes while the caller is still talking.","timer"],
 ["before","What lands in the transcript","The NEXT REPLY LLM answers the first half. The words after the pause come back later as a new caller turn of their own. Two caller rows around one agent row, for a single spoken answer, is the fingerprint of this bug.","hindi"],
 ["demo","Watch it happen","Six seconds of a call, with illustrative timings. Press Play. Press Show to switch between 1.2.1 and 1.8.1. Play it again."],
 ["now","The fix: opening a turn leaves _vad_user_speaking alone","Pipecat 1.6.0 (PR #4983) stopped the turn opening from clearing <code>_vad_user_speaking</code>. In 1.8.1 the controller calls <code>handle_user_turn_started()</code>, which runs <code>_reset(clear_vad_user_speaking=False)</code>. Closing a turn still clears it. Pipecat\'s own comment on the method gives the reason: the flag reflects live VAD state, not per-turn bookkeeping.","fixtrack"],
 ["now","So the wrong branch is no longer taken","The notes VAD wrote are left alone when the turn opens, so the code still knows the caller is talking. The answer to its question is no. It keeps the turn open and waits for VAD to report that the caller has really stopped.","branch2"],
 ["us","You can now read Pipecat\'s own description","<i>&ldquo;&hellip;ended the user turn mid-utterance when a new turn&rsquo;s reset() cleared VAD speaking state while the user was still talking.&rdquo;</i> Every term in that sentence is one you have now met. It goes on to mention a finalized transcript. Ours are never finalized, but the branch never checked, so the bug reached us all the same.","quote"],
 ["us","How to see it for yourself","No automated test covers this, because the fix is in Pipecat, not in our code. On the branch, make a call and answer a question in two halves, pausing about half a second between them. The pause has to be longer than 0.2 seconds, so VAD reports a stop, and short enough that you resume before Sarvam\'s transcript comes back. Then open <code>transcript.json</code> and count the caller rows for that answer.","bars"],
 ["us","Pipecat 1.6.0, PR #4983. No code from us","Nothing in our diff implements this fix. We get it by upgrading. That is the reason this PR exists.","pr"]
]);
/* ===== GEN LESSONS ===== */
les(0,"A transcript marked finished mid-sentence",[
 ["skip", "A turn closed mid-sentence because STT marked half a sentence as final", "Some STT services send a transcript marked final, then keep sending more words of the same sentence. Pipecat saw the final mark, skipped its wait, and closed the caller’s turn while the rest was still coming. The agent replied to half an answer. Pipecat 1.6.0 (PR #5043): when more words arrive after a final mark, that final mark is cancelled and the turn stays open.", "s2", "Sarvam STT sends one transcript at the end of the caller’s turn, never partial text, and never the final mark this fix watches for. No words ever arrive after a final mark on our calls, so this bug could not happen."]
]);
les(0,"One extra FILL FORM LLM call after a pause in bulk dictation",[
 ["over", "A brief pause mid-sentence in bulk dictation ran one extra FILL FORM LLM call, never a wrong reply. Fixed by upgrading", "Bulk dictation is when the caller says the whole form in one go. It closes turns with a different class, <code>TurnAnalyzerUserTurnStopStrategy</code>, which had the same bug as lesson 1: opening a turn wiped VAD’s record of whether the caller was speaking, so a brief pause mid-sentence started the 0.97 second wait for the Sarvam STT transcript. In bulk dictation we wrap that class in <code>deferred()</code>: when the wait ends it does not close the turn, it runs one FILL FORM LLM call instead. The only effect was one extra FILL FORM LLM call mid-dictation. Pipecat 1.7.0 (PR #5159): opening a turn no longer wipes that record. Nothing to do.", "s3"]
]);
les(0,"Smart Turn stuck after a mute",[
 ["over", "Smart Turn could keep half-heard speech after a mute. At most one extra FILL FORM LLM call. Fixed by upgrading", "Smart Turn is the model that judges, in bulk dictation, whether the caller has finished. When we mute the caller, Smart Turn stops hearing audio mid-judgement. In 1.2.1, if the turn then ended some other way, nothing reset Smart Turn, and once audio flowed again it could report a finish for a turn already over. Pipecat 1.6.0 (PR #4967) resets Smart Turn whenever a turn ends. For us it needs a bulk dictation agent with <code>mute_user_while_agent_speaking</code> on, and a turn closed by our 120 second limit on one dictation turn. Even then <code>deferred()</code> limits it to one extra FILL FORM LLM call. Nothing to do.", "s4"]
]);
les(0,"The NEXT REPLY LLM marking a turn finished too late",[
 ["skip", "A late NEXT REPLY LLM judgement closed a turn while the caller was talking again", "With <code>filter_incomplete_user_turns</code> on, Pipecat sends each caller turn to the NEXT REPLY LLM to judge whether it is complete. That judgement takes time. By the time it arrived, the caller had sometimes started talking again, and Pipecat closed the turn anyway, cutting them off. Pipecat 1.5.0 (PR #4938): a turn is not closed while VAD says the caller is speaking.", "s5", "We never turn on filter_incomplete_user_turns, so no such late judgement exists on our calls. The classes we use to end a caller’s turn already wait for the caller to stop."]
]);
les(0,"Answering twice",[
 ["skip", "The caller heard two replies to one answer", "With <code>filter_incomplete_user_turns</code> on, Pipecat sends each caller turn to the NEXT REPLY LLM to judge whether it is complete. When that judgement said incomplete, Pipecat started a timer to re-prompt the caller. If that timer fired at the same moment the NEXT REPLY LLM’s reply arrived, both were spoken. Pipecat 1.5.0 (PR #4938): one spoken reply at a time, and the timer is cancelled when a reply starts.", "s6", "Both the timer and the fix live in UserTurnCompletionLLMServiceMixin, which only runs with filter_incomplete_user_turns on. We never turn it on."]
]);
les(0,"Smart Turn’s time added to the wait",[
 ["over", "In bulk dictation, the wait after a pause ran long by Smart Turn’s thinking time. Fixed by upgrading", "After a pause in bulk dictation, <code>TurnAnalyzerUserTurnStopStrategy</code> waits 0.97 seconds for the Sarvam STT transcript. In 1.2.1 it ran Smart Turn first and started the 0.97 seconds only after Smart Turn answered, so Smart Turn’s time, 50 to 120 milliseconds by Pipecat’s own figure, was added on top. Pipecat 1.7.0 (PR #5007) counts the 0.97 seconds from the pause itself. For us, reaching that wait runs one FILL FORM LLM call (<code>deferred()</code> stops the class from ending the turn), so that call now starts 50 to 120 milliseconds earlier. Not measured on our servers. Nothing to do.", "s7"]
]);
les(0,"A re-prompt over a caller who had carried on",[
 ["skip", "The agent’s re-prompt talked over a caller who had already carried on talking", "With <code>filter_incomplete_user_turns</code> on, when the caller seemed to stop mid-answer, Pipecat spoke a re-prompt. In 1.2.1 only a full interruption cancelled it. A caller who simply carried on talking did not count as one, so the re-prompt talked over them. Pipecat 1.5.0 (PR #4938): the re-prompt is cancelled as soon as VAD hears the caller again.", "s8", "That re-prompt exists only with filter_incomplete_user_turns on. Pipecat’s other prompt for a silent caller exists only with user_idle_timeout above 0. Our code sets neither."]
]);
les(0,"A soft sound mid-word",[
 ["over", "A soft stretch inside a word could make VAD end the caller’s turn. Fixed by upgrading, on every call", "VAD (<code>SileroVADAnalyzer</code>) counts a 32 millisecond slice as speech only if Silero’s confidence is at least 0.7 and the loudness is at least 0.6. In 1.2.1 loudness was measured on each slice alone, so a soft stretch inside a word could fail six slices in a row: 0.2 seconds, the silence our VAD needs before it reports a stop. VAD reported a stop mid-word, and Sarvam STT sent its transcript early. Pipecat 1.8.0 (PR #5232) measures loudness over the last 400 milliseconds, so the loud start of the word keeps the soft middle above 0.6. Every call gets this. Not measured how often it happened. Nothing to do.", "s9"]
]);
les(1,"TTS replies with no audio",[
 ["over", "Pipecat 1.8.1 stops using TTS after 3 silent replies in a row. This PR turns that off", "Sometimes TTS answers a request with no audio. In 1.2.1 each line was tried on its own: one silent line, then the next one played. In 1.8.1 Pipecat counts silent replies, and after three in a row stops sending anything to TTS for the rest of the call: the call keeps running, the agent never speaks again (Pipecat 1.8.0, PR #5393). The limit is <code>max_consecutive_zero_audio_contexts</code>. This PR sets it to 0, which means no limit, on every TTS service in <code>bot.py</code>, so every line is tried, as in 1.2.1. A test fails if any TTS service in <code>bot.py</code> is created without that setting. Done in this PR.", "s10"]
]);
les(1,"A caller muted for the whole call",[
 ["over", "A silent intro leaves the caller muted for the whole call. Our own mute class still has this bug. Fix after the merge", "With an intro script, we mute the caller until the intro and the first question have finished playing. If TTS returns no audio for the intro, it never finishes playing, so we never unmute: the caller talks and every word is dropped until they hang up. Pipecat 1.8.0 (PR #5390) changed its own class, <code>MuteUntilFirstBotCompleteUserMuteStrategy</code>: it also unmutes when TTS reports an error before the intro starts, and 1.8.1 reports no audio as an error, even with lesson 10’s limit at 0. Our class, <code>MuteUntilNthBotCompleteUserMuteStrategy</code> in <code>bot.py</code>, only watches for those lines finishing. Fix: make it also unmute on that TTS error, with a test. Not in this PR.", "s11"]
]);
les(1,"A reply with no sound paused the call",[
 ["over", "On Sarvam TTS agents, a silent reply froze the call. Fixed by upgrading", "Sarvam TTS, used for languages other than English, Hindi and Hinglish, pauses the pipeline while a line plays so two lines never overlap, and unpauses when the line finishes playing. A line with no audio never finishes, so in 1.2.1 the pause stayed until the caller interrupted. Worst case was the closing line: our code sends it, then asks Pipecat to stop once it has played, and the stop waited behind the pause until the caller hung up. Pipecat 1.8.0 (PR #5394) pauses only when there is audio to wait for. Google TTS never pauses. Nothing to do.", "s12"]
]);
les(1,"A stuck audio send",[
 ["over", "Sending audio to a browser or phone line that stopped taking it could hang the call forever. Fixed by upgrading", "The output transport sends the agent’s audio to the browser or the phone line. In 1.2.1, if the other side stopped taking audio but kept the connection open, one send could wait forever: the agent went silent and the call could not finish ending. Pipecat 1.8.0 (PR #5424) gives each send 10 seconds (<code>audio_out_write_timeout_secs</code>). After that the transport is marked unusable, later audio is dropped, and the call can end. Browser, Twilio and Exotel calls all get this. This hang never showed in our logs. Fixed by upgrading. Nothing to do.", "s13"]
]);
les(1,"A hanging setup step",[
 ["over", "A call that could not finish setting up now ends after 20 seconds, not 5 minutes. Decided: leave it", "Before the agent can speak, the pipeline connects Sarvam STT and loads the noise filter model. In 1.2.1, if one of those hung, the caller heard silence until Pipecat’s 5 minute idle timeout ended the call. Pipecat 1.8.0 (PR #5316) gives that setup 20 seconds. After setup, a start signal passes through every part of the pipeline, and that gets another 20 seconds. If either runs longer, the call ends. The noise filter model is not in our Docker image, so the first call after each deploy downloads it inside those 20 seconds. Not measured; if it takes over 20 seconds, that first call ends. Decided: leave it for now.", "s14"]
]);
les(1,"One failed cleanup blocked the rest",[
 ["over", "One part failing to close no longer stops the others closing. Fixed by upgrading; our saved call data was never affected", "When a call ends, Pipecat asks each part of the pipeline to clean up: close Sarvam STT, stop the noise filter, and so on. In 1.2.1 this ran one part at a time, and one failure skipped every part after it, so those parts were never closed. Pipecat 1.8.0 (PR #5316) logs the failure and cleans up the rest. None of our own parts has a cleanup step, and saving the recording, transcript and metrics runs in our own code after the pipeline stops, so it was never affected. Fixed by upgrading. Nothing to do.", "s15"]
]);
les(1,"The goodbye that never got said",[
 ["skip", "A goodbye written by the NEXT REPLY LLM was never spoken", "With <code>filter_incomplete_user_turns</code> on, Pipecat 1.5.0 allowed one spoken reply per caller turn. The line Pipecat makes the agent say when the caller stays silent counts as a second reply in the same turn, so the NEXT REPLY LLM wrote it and Pipecat silently dropped it, including a final goodbye. Pipecat 1.2.1 did not have this limit. Pipecat 1.7.0 (PR #5146): that line is always spoken.", "s16", "Needs filter_incomplete_user_turns on and the silent-caller line sent with LLMMessagesAppendFrame. We use neither. Our closing line is a TTSSpeakFrame, spoken as written."]
]);
les(1,"Closing lines cut off mid-sentence",[
 ["skip", "A closing line sent just before the pipeline ended was cut off", "<code>PipelineWorker.end()</code> stopped the pipeline at once, so a line sent just before it, such as a goodbye, was cut off mid-sentence. Pipecat 1.8.0 (PR #5399): <code>end()</code> and <code>activate_worker()</code> first wait for lines already sent to finish playing. Cancelling still stops at once.", "s17", "Our code ends a call with stop_when_done(), which ends the call only after the closing line has played and did not change, or with cancel(), which stops at once in both versions. We never call end() or activate_worker()."]
]);
les(2,"Firefox’s empty end-of-list entry made a connection request fail",[
 ["over", "Every Firefox browser call sent our server a request it answered with an error. Fixed by upgrading", "To connect a browser call, the browser sends our server its network addresses. Firefox always ends the list with an empty entry meaning no more addresses. In 1.2.1 that empty entry made Pipecat’s code fail, and our <code>PATCH /offer</code> route returned an error. The addresses before it were already added, so the call may still have connected; not checked. Pipecat 1.7.0 (PR #5126) accepts the empty entry. Fixed by upgrading. Nothing to do.", "s18"]
]);
les(2,"Early messages dropped on a slow browser",[
 ["skip", "Messages sent to the browser before it finished connecting were lost", "Beside audio, the server sends the browser small messages. In 1.2.1, on a slow network, a message sent before the browser had finished connecting was dropped, with no log. Pipecat 1.7.0 (PR #5112): messages are held and sent once the browser is connected.", "s19", "The one message our server sends before the browser connects is user-mute-started, when the caller is muted for the intro. Our web page has no code that reads it, so nothing showed before and nothing shows now."]
]);
les(2,"Browser audio at half speed",[
 ["skip", "Browser audio was read at half speed", "The browser sends audio at 48,000 samples a second, in stereo. Pipecat converts it to the pipeline’s rate, in mono. When the pipeline also ran at 48,000, Pipecat skipped the conversion, so the two stereo channels were read as one mono stream: garbled, at half speed. STT heard nonsense. Pipecat 1.7.0 (PR #5115): convert whenever stereo must become mono, not only when the rate differs.", "s20", "run_bot_webrtc() runs our browser calls at 16,000 samples a second, so the rate never matched 48,000 and every piece of audio was converted in 1.2.1 too."]
]);
les(2,"A dead audio track read 100 times a second",[
 ["over", "When a caller’s browser audio track died, the server logged 100 warnings a second. Now it logs once", "The server reads the caller’s browser audio in a loop. If the track ends mid-call, for example a headset unplugged, every read fails. In 1.2.1 the loop logged a warning, waited 10 milliseconds, and read again, about 100 warnings a second until the call ended. It did not tie up the CPU. Pipecat 1.3.0 (PR #4491) logs one warning, drops the dead track and stops reading it. Not checked how often a track dies mid-call on our calls. Fixed by upgrading. Nothing to do.", "s21"]
]);
les(2,"Exotel messages used Twilio’s field name",[
 ["over", "Our Exotel messages now use Exotel’s spelling of the stream id. No behaviour change", "Every audio message we send to Exotel carries the call’s stream id. 1.2.1 labelled it <code>streamSid</code>, Twilio’s spelling. Exotel spells it <code>stream_sid</code>. Pipecat 1.8.0 (PR #5219) uses Exotel’s spelling. Pipecat’s changelog says Exotel treats the id as optional on messages from the bot, so the old spelling did no harm. Fixed by upgrading. Nothing to do.", "s22"]
]);
les(2,"Waiting on a phone line that had already closed",[
 ["over", "After a Twilio or Exotel caller hangs up, our server finishes the call up to 10 seconds sooner", "When a call ends, Pipecat closes the phone line and waits for Twilio or Exotel to confirm. If the line was already dead on their side, nothing confirmed, and 1.2.1 waited about 10 seconds before the call record was saved. Pipecat 1.4.0 (PR #4723) waits at most half a second (<code>ws_close_timeout</code>). A separate change in Pipecat 1.7.0 sets a 2 second wait for STT and TTS services that keep an open connection (a websocket) to their provider. Sarvam STT and Google TTS do not connect that way, so it does not touch us. Fixed by upgrading. Nothing to do.", "s23"]
]);
les(3,"Token counts reported many times",[
 ["skip", "Pipecat counted one reply’s tokens several times when the provider sent a running count on every chunk", "The NEXT REPLY LLM streams its reply in chunks. Some providers attach the running token count to every chunk. Pipecat reported each one, so one reply could be added up three or four times in cost tracking. Pipecat 1.8.0 (PR #5190): keep the last count and report it once, when the reply ends.", "s24", "OpenRouter, which our NEXT REPLY LLM uses, sends the count once, in the last chunk (OpenRouter’s usage docs). The FILL FORM LLM does not go through this Pipecat code."]
]);
les(3,"Why the Overall Latency chart is gone",[
 ["over", "Sarvam STT no longer reports a processing time. The playground chart that needed it is gone, and so is the page", "Pipecat 1.8.0 (PR #5209) stopped streaming STT services, Sarvam included, from reporting a processing time: audio arrives all the time, so there is no single piece of work to time. STT TTFB, the time to the first part of the transcript, is still sent. The playground page’s Overall Latency chart summed five timings per turn and needed that one, so it could never get a new point again. Our upgrade PR removed the chart, then deleted the playground page altogether (Module 6). The Call metrics dialog is unchanged: it reads <code>metrics.json</code>, which our own code fills without this Pipecat number. Fixed in this PR.", "s25"]
]);
les(3,"LLM response time measured the same way everywhere",[
 ["skip", "Three LLM classes measured response time from the wrong moment", "TTFB is the time from sending the request to the first part of the reply. <code>AnthropicLLMService</code> and <code>AWSBedrockLLMService</code> stopped the timer when the connection opened, before any reply. <code>GoogleLLMService</code> stopped it on a first chunk that could hold no text. Their numbers looked better than they were. Pipecat 1.8.0 (PR #5319): all classes stop at the first real content.", "s26", "We use none of those three. Our NEXT REPLY LLM goes through OpenRouterLLMService, which measures TTFB the same way in 1.2.1 and 1.8.1."]
]);
les(3,"Dates read aloud in mixed languages",[
 ["skip", "A spoken date could mix two languages", "<code>normalize_dates()</code>, added in 1.5.0, turns a date in the reply into spoken words before TTS reads it. It took the month name from the server’s language setting, so a server set to German said “Mai 10th, two thousand and twenty-three”. Pipecat 1.6.0 (PR #4956): month names are always English.", "s27", "normalize_dates() runs only if a bot adds it to a TTS service’s text_transforms. Our code never does."]
]);
les(3,"The saved words did not match what the NEXT REPLY LLM wrote",[
 ["skip", "The saved reply followed the TTS provider’s spelling, not the NEXT REPLY LLM’s", "Some TTS classes (ElevenLabs, Cartesia and others) report each word as they play it, and Pipecat built the saved reply from those reports. If the provider spelled a word differently, cafe for café, the transcript and the conversation history the NEXT REPLY LLM reads got the provider’s spelling. Pipecat 1.8.0 (PR #5370): match the words ignoring accents and save the NEXT REPLY LLM’s text.", "s28", "Google TTS and Sarvam TTS do not report each word as they play it. Pipecat saves the sentence exactly as the NEXT REPLY LLM wrote it, in both versions."]
]);
les(4,"Smart Turn stopped loading a large library",[
 ["over", "Every server start no longer loads the transformers library. Comes with the upgrade, nothing to do", "Smart Turn is the model bulk dictation uses to judge whether the caller has finished. In 1.2.1 loading Smart Turn also loaded transformers, a large library, to prepare the audio. Pipecat 1.3.0 (PR #4536) prepares it with a small numpy function, and Pipecat checked the prepared audio comes out almost exactly the same. Pipecat measured: peak memory about 566 MB to about 60 MB, load time about 5 seconds to about 0.3 seconds. <code>bot.py</code> loads Smart Turn at server start, so this happened on every start. Our install is not smaller: <code>pyproject.toml</code> still installs transformers and torch through the local-smart-turn option. Not measured on our server.", "s29"]
]);
les(4,"Pipecat loads in half the time",[
 ["over", "Pipecat now loads NLTK on first use, so the server starts faster. The punkt_tab check moves to the first call after a deploy", "Loading Pipecat at server start used to load NLTK too, and through it scikit-learn and scipy. Pipecat 1.8.0 (PR #5253) loads NLTK on first use instead. Pipecat measured loading Pipecat going from about 2.2 seconds to about 1.0, once per server start. NLTK needs a data file, punkt_tab, which is not in our Docker image. In 1.2.1 the server checked for it, and downloaded it if missing, while starting. In 1.8.1 <code>PipelineWorker</code> does that check in the background during the first call’s setup after a deploy. Whether that makes the first call’s setup slower is not measured. Nothing to do; comes with the upgrade.", "s30"]
]);
les(4,"Services now connect at the same time",[
 ["over", "Sarvam STT connects while the noise filter loads, instead of after it. Nothing to do", "Before a call starts, each part of the pipeline gets ready. In 1.2.1 this ran one part after another. Pipecat 1.8.0 (PR #5316) runs them all at once, so start-up takes as long as the slowest part. Only two of our parts do slow work at the start: Sarvam STT connecting, and the noise filter loading its model. Google TTS and OpenRouter open no connection at start. How much faster this makes a call start is not measured. Comes with the upgrade, nothing to do.", "s31"]
]);
les(4,"The VAD thread is now shut down when the call ends",[
 ["over", "The VAD thread of a finished call is now shut down. Whether threads ever built up on our server was not checked", "<code>SileroVADAnalyzer</code> runs its model on a thread of its own (a background worker inside the server). In 1.2.1 nothing shut that thread down when the call ended. Pipecat 1.8.0 (PR #5350) shuts it down when the call is cleaned up. We build a new VAD per call. Python also ends an idle thread like this once nothing holds on to the finished call, so threads only built up if something kept old calls in memory. Not checked on our server. Fixed by upgrading, nothing to do.", "s32"]
]);
les(5,"Scripted lines and the NEXT REPLY LLM’s context",[
 ["over", "New default: every scripted line enters the NEXT REPLY LLM’s context. This PR: only the intro does", "Every scripted line our code speaks (intro, acknowledgement, closing line, four more) has a setting, <code>append_to_context</code>: add this line to the NEXT REPLY LLM’s context. Old default: add only if a NEXT REPLY LLM reply came right after. That added the acknowledgement; our code then removed it for agents with fixed phrases. New default, Pipecat 1.4.0 (PR #4642): always add. With no setting, all seven lines would enter, and the NEXT REPLY LLM would copy the acknowledgement into every question. This PR: intro yes, the other six no; the removal code is deleted. Where the FILL FORM LLM words the acknowledgement, it now stays out too. Decided: keep it out.", "s33"]
]);
les(5,"The noise filter’s model had to change",[
 ["over", "This PR sets the noise filter model to quail-vf-2.2-l-16khz. The old one does not load on the new aic-sdk", "The noise filter (ai-coustics, <code>AICFilter</code>) removes background noise before STT hears the caller. Pipecat 1.8.0 requires aic-sdk 3, so ours moved from 2.2.1 to 3.1.1. aic-sdk 3.1.1 needs model version v7, and our old model <code>quail-vf-2.1-l-16khz</code> is only published as v3 to v5: running it gives ModelDownloadError. This PR sets <code>AIC_MODEL_ID = \"quail-vf-2.2-l-16khz\"</code>, published as v7, which loads. It also adds <code>SafeAICFilter</code>: if the model ever fails to load, the call goes on without noise removal and the log says so. Tests check the model name and that the call goes on without noise removal.", "s34"]
]);
les(5,"Sarvam’s default moved to v4",[
 ["avail", "Pipecat’s default Sarvam STT model is now saaras:v4", "Pipecat 1.8.0 (PR #5382) changed the model <code>SarvamSTTService</code> uses when none is named, from saaras:v3 to saaras:v4. Our <code>bot.py</code> has named saaras:v3 since April 2026, so the default never applies to us and this PR did not change our model.", "s35", "One value in bot.py. First compare v3 and v4 transcripts on our own call audio. Same as Lesson 42 in Module 8."]
]);
les(5,"Two classes were renamed",[
 ["over", "bot.py uses Pipecat’s new class names. Done in this PR", "Pipecat 1.3.0 renamed <code>PipelineTask</code> to <code>PipelineWorker</code> and <code>PipelineRunner</code> to <code>WorkerRunner</code>. Starting a call went from one step to two: <code>add_workers()</code>, then <code>run()</code>. The old names still work with a warning until Pipecat 2.0. Three other places still had the old names: the editor notes file <code>.cursor/rules/overview.md</code>, the imports in the recording tests, and one comment. All fixed in commit d9eb212.", "s36"]
]);
les(5,"The playground page is deleted",[
 ["over", "The playground page is deleted. Done in this PR", "The playground page, <code>/agents/&lt;agent id&gt;/playground</code>, was a test-call page with three tabs: Conversation, Logs, Metrics. Its Metrics tab had an Overall Latency chart that needed Sarvam STT’s processing time, which 1.8.1 no longer sends, so that chart could never draw again. First commit 1b4d93e removed the chart. Then, after you decided the page is not needed, the whole page was deleted, with the code only it used: MetricsPanel, MetricChart, LogsPanel, TabNavigation, and their tests. The public call page, <code>/agents/&lt;agent id&gt;</code>, is unchanged. Done in this PR.", "s37"]
]);
les(6,"Recordings get longer",[
 ["over", "Recordings now include the time the caller is muted while the agent is not speaking", "<code>AudioBufferProcessor</code> builds the recording from the audio it receives from the caller and the agent. A silent caller still sends audio, so ordinary pauses were always in the file. What 1.2.1 left out: time when no audio reached it from either side. When our code mutes the caller, it drops the caller’s audio before it reaches <code>AudioBufferProcessor</code>. So when the agent was not speaking either, that stretch was missing. Example: between the intro and the first question, while the NEXT REPLY LLM writes it. Pipecat 1.3.0 (PR #4567) writes that stretch as silence. Recordings before and after the deploy are not directly comparable. Nothing to do.", "s38"]
]);
les(6,"Call durations get longer",[
 ["over", "Call duration in analytics gets longer on the deploy date, for agents with an intro script. Nothing to fix", "Each row in <code>transcript.json</code> has a timestamp: when our code wrote it. Call duration is the last row’s timestamp, plus its audio length, minus the first row’s. Before this PR the intro and the first question were one row, written when the question ended. This PR sends the intro with <code>append_to_context=True</code>, so the intro gets its own row, written when it ends. (Lesson 33 covers why: Pipecat 1.4.0 changed that default, so this PR sets it on every line.) The first timestamp is earlier, so the duration is longer, by the time to write and say the first question. How much longer is not measured. Nothing to fix.", "s39"]
]);
les(6,"A broken API key now stops the service",[
 ["over", "A permanent STT or TTS error now marks the service unusable. For Sarvam STT the outcome is the same as before. Decided: leave it", "Pipecat 1.8.0 (PR #5242) marks STT or TTS unusable after a permanent error such as a rejected API key, and stops giving it work for the rest of the call, instead of retrying on every piece of audio. There is no setting to turn this off. <code>bot.py</code> does nothing when a service is marked unusable. For us the difference is small: Sarvam STT connects once, and in 1.2.1 a failed connect already gave one error and then dropped all caller audio. Not tested whether a Google TTS error is ever treated as permanent. A broken key looks like an agent that never hears the caller. Decided: leave it.", "s40"]
]);
les(7,"A faster Sarvam STT service",[
 ["avail", "A second Sarvam STT class, built for lower delay", "Pipecat 1.8.0 (PR #5301) adds <code>SarvamRealtimeSTTService</code>: a different Sarvam server address, a different model (saaras:v3-realtime), and words sent as they are heard, not only at the end of the caller’s turn. Pipecat’s delay estimate for it is 1.00 seconds, against 1.17 seconds for <code>SarvamSTTService</code>, the class we use. Pipecat marks the 1.00 seconds as unmeasured.", "s41", "A few lines in bot.py to pick the new class, endpointing=\"manual\" so our own code, not Sarvam, decides when the caller’s turn ends, and a transcript quality check on our own calls, since it is a different model."]
]);
les(7,"The newer Sarvam model, v4",[
 ["avail", "saaras:v4: a newer Sarvam STT model, with global English", "Pipecat 1.8.0 (PR #5382) adds saaras:v4 to <code>SarvamSTTService</code>. Same connection and settings as v3, plus what Sarvam calls global English (Pipecat’s changelog does not define it further), on top of Indian English and 22 Indian languages. It is also Pipecat’s new default, which we do not get because <code>bot.py</code> names saaras:v3.", "s42", "Change that one value, after comparing v3 and v4 transcripts on our own call audio."]
]);
les(7,"Telling speech-to-text which words to expect",[
 ["avail", "Google, Cartesia and Smallest STT accept a list of words to listen for. Sarvam STT does not", "Google STT (adaptation, 1.8.0), Cartesia STT (keyterm, 1.7.0) and Smallest STT (keywords, 1.7.0) can be told which words to expect, so names like Anganwadi or a village are heard more reliably. Sarvam STT had a prompt setting in 1.2.1 that only the old saaras:v2.5 model honoured; our saaras:v3 ignored it and <code>bot.py</code> never set it. 1.8.0 removed it.", "s43", "SarvamSTTService has no such setting now, and never had one our model honoured. SarvamRealtimeSTTService has a prompt setting, but Pipecat does not say whether it helps with specific words. Otherwise this needs a change of STT provider."]
]);
les(7,"Phone keypad presses as an answer",[
 ["skip", "A keypad entry could stall the caller’s turn", "<code>DTMFAggregator</code> turns phone key presses into a transcript line such as DTMF: 3, so it counts as a spoken answer. It sent that line marked as not final, so Pipecat, waiting for a final transcript before ending the caller’s turn, kept waiting, and the turn hung. Pipecat 1.7.0 (PR #5172): the line is marked final.", "s44", "DTMFAggregator is not in our pipeline. Twilio and Exotel send key presses, and we drop them."]
]);
les(7,"Seconds of audio sent to STT",[
 ["avail", "Pipecat reports the seconds of audio sent to STT per call", "Pipecat 1.7.0 (PR #5055) adds this number, and it already arrives on our calls. Our <code>UsageObserver</code> keeps only NEXT REPLY LLM token counts and TTS character counts, so it drops this one. Today our STT cost is worked out after the call from the caller audio clips.", "s45", "A few lines in UsageObserver to keep the number. Then decide: it counts all audio sent, silences included, while our current STT cost counts only the caller’s speech. Check which one Sarvam bills."]
]);
les(7,"Numbers and dates spoken more naturally",[
 ["avail", "text_transforms: numbers, money and dates spoken as words before TTS reads them", "Pipecat 1.5.0 (PR #4854) adds <code>text_transforms</code> that rewrite a reply just before TTS reads it: Rs 500 as five hundred rupees, 10/05/2026 as tenth of May twenty twenty-six. <code>VoiceFormatter</code> bundles them. We use none.", "s46", "One setting on GoogleTTSService in bot.py. They write English words only, so a Hindi or Kannada agent would switch to English mid-sentence."]
]);
les(7,"Thinking time measured apart from answering",[
 ["skip", "A new timing for the NEXT REPLY LLM: time to the first answer word, thinking excluded", "Pipecat’s existing timing for the NEXT REPLY LLM, TTFB, is the time from the request to the first token back. For a model that thinks before answering, that first token is a thinking token, so TTFB hides how long the caller really waited. Pipecat 1.8.0 (PR #5320) adds TTFAT: the time from the request to the first word of the actual answer, with thinking time reported separately.", "s47", "We do not read TTFAT. llm_services.py already saves, per turn, the time to the NEXT REPLY LLM’s first answer token after any thinking, in metrics.json. Same number."]
]);
les(7,"New events for saving each turn’s audio",[
 ["avail", "New events: each turn’s audio once per turn, with the turn number", "Pipecat 1.8.0 (PR #5329) adds two events on <code>AudioBufferProcessor</code>, <code>on_user_turn_audio</code> and <code>on_bot_turn_audio</code>: each turn’s audio, once per turn, with the turn number. We still save turn audio from the old events: once per run of speech, several times a turn, no turn number. <code>bot.py</code> listens to the new <code>on_bot_turn_audio</code> only in 30 lines that recover the agent audio an interruption cuts off. Pipecat removes the old events in 2.0; our <code>pyproject.toml</code> does not allow Pipecat 2.0.", "s48", "Switch to the new events, delete those 30 lines, let turn_audio_recording.py use Pipecat’s turn number."]
]);

var KEY="pc-course-v4", seen={}, vis={}, autoed={};
try{ var st=JSON.parse(localStorage.getItem(KEY)||"{}")||{};
     seen=st.done||{}; vis=st.slides||{}; autoed=st.autoed||{}; }catch(e){ seen={}; vis={}; autoed={}; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify({done:seen,slides:vis,autoed:autoed})); }catch(e){} }
function slidesSeen(li){ var v=vis[li]||{},n=0; for(var k in v) if(v[k]) n++; return n; }

var at=0, open={};
L.forEach(function(l){ open[l.m]=false; }); open[0]=true;

var sideEl=document.getElementById("side"), slideEl=document.getElementById("slide"),
    whereEl=document.getElementById("where"), pipsEl=document.getElementById("pips"),
    tbar=document.getElementById("tbar"), tnum=document.getElementById("tnum"),
    prevB=document.getElementById("prev"), nextB=document.getElementById("next"),
    markB=document.getElementById("mark");

function lessonDone(li){ return !!seen[li]; }
function modCount(mi){ var t=0,d=0; L.forEach(function(l,i){ if(l.m===mi){t++; if(lessonDone(i))d++;} }); return [d,t]; }

function buildSide(){
  sideEl.innerHTML="";
  M.forEach(function(m,mi){
    var c=modCount(mi);
    var h=document.createElement("button");
    h.className="mhead"; h.setAttribute("aria-expanded",open[mi]?"true":"false");
    h.setAttribute("data-full",c[0]===c[1]?"1":"0");
    h.innerHTML='<span><small>Module '+(mi+1)+'</small>'+m[0]+'</span>'+
                '<span class="mcount">'+c[0]+'/'+c[1]+'</span><span class="caret"></span>';
    h.addEventListener("click",function(){ open[mi]=!open[mi]; buildSide(); });
    sideEl.appendChild(h);

    var ul=document.createElement("div"); ul.className="llist"; ul.hidden=!open[mi];
    L.forEach(function(l,li){
      if(l.m!==mi) return;
      var b=document.createElement("button");
      b.className="li";
      b.setAttribute("data-done",lessonDone(li)?"1":"0");
      b.setAttribute("data-live",FLAT[at].li===li?"1":"0");
      var notUs = l.s.length===1 && l.s[0][0]==="skip";
      var avail = l.s.length===1 && l.s[0][0]==="avail";
      b.setAttribute("data-skip",notUs?"1":"0");
      b.setAttribute("data-avail",avail?"1":"0");
      b.innerHTML='<span class="dot"></span><span>'+l.t+'</span>'+
                  (notUs ? '<span class="ltag">not relevant</span>'
                   : avail ? '<span class="ltag av">available</span>'
                   : '<span class="lcount">'+slidesSeen(li)+'/'+l.s.length+'</span>');
      b.addEventListener("click",function(){ go(startOf(li)); });
      ul.appendChild(b);
    });
    sideEl.appendChild(ul);
  });
  var d=0; L.forEach(function(_,i){ if(lessonDone(i)) d++; });
  tbar.style.width=((d/L.length)*100)+"%";
  tnum.textContent=d+" / "+L.length+" lessons";
}

/* ===== HTML diagram builders ===== */
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
// mark: substrings to highlight inside the code excerpt
function hl(code,marks){var h=esc(code);(marks||[]).forEach(function(m){var e=esc(m);h=h.split(e).join("<mark>"+e+"</mark>");});return h;}
// before/after panel of real source lines
function codepair(o){
  return '<div class="cp">'+(o.cap?'<div class="cp-cap">'+o.cap+'</div>':'')+
   '<div class="cp-box b"><div class="cp-h"><b>'+(o.bl||"Pipecat 1.2.1")+'</b><span>'+esc(o.file||"")+'</span></div><pre>'+hl(o.before,o.bm)+'</pre></div>'+
   '<div class="cp-box a"><div class="cp-h"><b>'+(o.al||"Pipecat 1.8.1")+'</b><span>'+esc(o.file2||o.file||"")+'</span></div><pre>'+hl(o.after,o.am)+'</pre></div>'+
   (o.note?'<div class="cp-note">'+o.note+'</div>':'')+'</div>';
}
// one panel of real source
function codeone(o){
  return '<div class="cp">'+(o.cap?'<div class="cp-cap">'+o.cap+'</div>':'')+
   '<div class="cp-box '+(o.tone||"a")+'"><div class="cp-h"><b>'+(o.label||"Pipecat 1.8.1")+'</b><span>'+esc(o.file||"")+'</span></div><pre>'+hl(o.code,o.marks)+'</pre></div>'+
   (o.note?'<div class="cp-note">'+o.note+'</div>':'')+'</div>';
}
// our production setup, with the component a change touches
// rows: [label, detail, state]  state: "hit" (changed and in production), "miss" (in production, untouched), "off" (not in production)
function stack(o){
  var r=(o.rows||[]).map(function(x){
    var tag=x[3]||{hit:"changed, in production",miss:"in production",off:"not in production",moot:"changed, not in production"}[x[2]]||"";
    return '<div class="stk-row '+x[2]+'"><div>'+x[0]+(x[1]?'<small>'+x[1]+'</small>':'')+'</div><span class="tag">'+tag+'</span></div>';
  }).join("");
  return '<div class="cp">'+(o.cap?'<div class="cp-cap">'+o.cap+'</div>':'')+'<div class="stk">'+r+'</div>'+(o.note?'<div class="cp-note">'+o.note+'</div>':'')+'</div>';
}

// three plain boxes that repeat the slide's text in one line each
function simple3(o){
  function box(cls,label,text){ return '<div class="s3 '+cls+'"><b>'+label+'</b>'+text+'</div>'; }
  return '<div class="cp s3wrap">'+box("b","Before, 1.2.1",o.before)+box("a","Now, 1.8.1",o.after)+box("u","What it means for us",o.us)+'</div>';
}

var PLAYER='<div class="prow"><button class="btn solid" id="play">Play</button>'+
 '<button class="btn" id="flip">Show: <span id="fl">Before</span></button></div>'+
 '<div class="well"><div class="lane"><div class="lh"><span id="ll">Before &middot; 1.2.1</span>'+
 '<span class="vd" id="vd" data-t="bad">&nbsp;</span></div>'+
 '<div class="tracks">'+
  '<div class="tl">caller</div><div class="track">'+
   '<div class="blob c" style="left:8%;width:33%">&#2350;&#2352;&#2368;&#2364;&#2332;&#2364; &#2325;&#2379; &#2348;&#2369;&#2326;&#2366;&#2352; &#2361;&#2376;</div>'+
   '<div class="blob" id="b2" style="left:52%;width:25%">&#2340;&#2368;&#2344; &#2342;&#2367;&#2344; &#2360;&#2375;</div>'+
  '</div>'+
  '<div class="tl">agent</div><div class="track">'+
   '<div class="blob a" id="ba" style="left:80%;width:18%">reply</div>'+
  '</div>'+
  '<div class="cut" id="cu" style="left:48%"><span>turn closed</span></div><div class="ph" id="pl"></div>'+
 '</div>'+
 '<div class="rul"><span style="left:0%">0s</span><span style="left:50%">3s</span><span style="left:100%">6s</span></div>'+
 '</div></div>';

function render(){
  var f=FLAT[at], l=L[f.li], s=l.s[f.si], m=M[l.m];
  var lessonNo=L.filter(function(x,i){ return x.m===l.m && i<=f.li; }).length;
  var modTotal=modCount(l.m)[1];

  whereEl.innerHTML='<b>Module '+(l.m+1)+'</b> &middot; '+m[0]+' &nbsp;|&nbsp; Lesson '+lessonNo+' of '+modTotal+
    ' &nbsp;|&nbsp; '+l.t;

  pipsEl.innerHTML="";
  l.s.forEach(function(_,i){
    var p=document.createElement("button"); p.className="pip";
    p.setAttribute("data-on",i===f.si?"1":"0");
    p.setAttribute("data-seen",i<f.si?"1":"0");
    p.setAttribute("aria-label","Slide "+(i+1));
    p.addEventListener("click",function(){ go(startOf(f.li)+i); });
    pipsEl.appendChild(p);
  });

  var kind=s[0];
  var label={over:"What this is about",setup:"Setup",trap:"The trap",before:"Before",now:"Now",us:"For us",num:"By the numbers",demo:"Try it",skip:"Not relevant to us",avail:"Improvement available. Not used yet",take:"What adopting it would take",what:"What it is"}[kind]||"";
  slideEl.setAttribute("data-k",kind);

  var head;
  if(kind==="num"){
    var parts=s[1].split("→");
    head='<div class="kind">'+label+'</div>'+(parts.length===2
      ? '<div class="big"><s>'+parts[0].trim()+'</s>'+parts[1].trim()+'</div>'
      : '<div class="big">'+s[1]+'</div>')+(s[2]?'<p>'+s[2]+'</p>':'');
  } else {
    head='<div class="kind">'+label+'</div><h2>'+s[1]+'</h2>'+(s[2]?'<p>'+s[2]+'</p>':'')+
      (s[4]?'<div class="why"><b>'+(kind==="avail"?"What adopting it would take":"Why not relevant to us")+'</b>'+s[4]+'</div>':'');
  }

  var art = kind==="demo" ? PLAYER : (s[3] && VIS[s[3]] ? VIS[s[3]]() : "");
  if(art){
    slideEl.className="slide hasvis";
    slideEl.innerHTML='<div class="txt">'+head+'</div><div class="vis">'+art+'</div>';
  } else {
    slideEl.className="slide";
    slideEl.innerHTML=head;
  }
  if(kind==="demo") wirePlayer();

  (vis[f.li]=vis[f.li]||{})[f.si]=true;
  if(f.si===l.s.length-1 && !autoed[f.li]){ autoed[f.li]=true; seen[f.li]=true; }
  save();

  markB.textContent = seen[f.li] ? "\u2713 Lesson done" : "Mark lesson done";
  markB.setAttribute("data-on", seen[f.li]?"1":"0");

  prevB.disabled=at===0;
  nextB.disabled=at===FLAT.length-1;
  nextB.textContent = at===FLAT.length-1 ? "Finished"
    : (f.si===l.s.length-1 ? "Next lesson →" : "Next →");

  buildSide();
  window.scrollTo(0,0);
}
function go(i){ at=Math.max(0,Math.min(FLAT.length-1,i)); render(); }

markB.addEventListener("click",function(){
  var li=FLAT[at].li; seen[li]=!seen[li]; autoed[li]=true; save(); render();
});
prevB.addEventListener("click",function(){ go(at-1); });
nextB.addEventListener("click",function(){ go(at+1); });
document.getElementById("rst").addEventListener("click",function(){ seen={}; vis={}; autoed={}; save(); go(0); });
document.addEventListener("keydown",function(e){
  if(e.target&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(e.key==="ArrowRight") go(at+1);
  if(e.key==="ArrowLeft") go(at-1);
});

function wirePlayer(){
  var SPAN=6,pct=function(s){return s/SPAN*100;},mode="before",timer=null;
  var b2=document.getElementById("b2"),ba=document.getElementById("ba"),cu=document.getElementById("cu"),
      pl=document.getElementById("pl"),vd=document.getElementById("vd"),ll=document.getElementById("ll"),
      play=document.getElementById("play"),flip=document.getElementById("flip"),fl=document.getElementById("fl");
  var CB=3.7,RB=3.8,CA=5.0,RA=5.1;
  function paint(){
    var b=mode==="before";
    ll.textContent=b?"Before · 1.2.1":"Now · 1.8.1";
    cu.style.left=pct(b?CB:CA)+"%";
    b2.className="blob "+(b?"x":"c");
    ba.style.left=pct(b?RB:RA)+"%"; ba.style.width=(100-pct(b?RB:RA)-2)+"%";
    vd.textContent=" "; vd.setAttribute("data-t",b?"bad":"good");
    cu.setAttribute("data-on","0"); pl.style.left="0%"; fl.textContent=b?"Before":"Now";
  }
  play.addEventListener("click",function(){
    if(timer) cancelAnimationFrame(timer);
    var b=mode==="before",cutAt=b?CB:CA,t0=performance.now(),DUR=4200;
    cu.setAttribute("data-on","0"); vd.textContent=" "; play.disabled=true;
    (function fr(now){
      var k=Math.min(1,(now-t0)/DUR); pl.style.left=(k*100)+"%";
      if(k*SPAN>=cutAt){ cu.setAttribute("data-on","1"); vd.textContent=b?"half the answer lost":"whole answer kept"; }
      if(k<1){ timer=requestAnimationFrame(fr); } else { timer=null; play.disabled=false; }
    })(t0);
  });
  flip.addEventListener("click",function(){ mode=mode==="before"?"after":"before"; paint(); });
  paint();
}

render();
})();
</script>
